name: Generate Drafts

on:
  workflow_dispatch:
    inputs:
      draft_limit:
        description: "Maximum number of research stories to turn into drafts (1-3)"
        required: true
        default: "3"
        type: choice
        options: ["1", "2", "3"]

permissions:
  contents: read

concurrency:
  group: generate-drafts
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Type-check
        run: npm run typecheck
      - name: Run tests
        run: npm test
      - name: Fetch latest research report
        run: npm run research
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Generate and save drafts
        run: npm run generate-drafts
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_FREE_MODEL: ${{ vars.OPENROUTER_FREE_MODEL }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          ALLOW_PAID_AI: "false"
          DRAFT_LIMIT: ${{ inputs.draft_limit }}
      - name: Upload draft report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scoialpilot-drafts
          path: reports/drafts-latest.json
          if-no-files-found: ignore
          retention-days: 7
