name: Generate Drafts

on:
  schedule:
    # Check the configured local-time schedule hourly. The database decides whether a run is due.
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      draft_limit:
        description: "Number of distinct content drafts to generate (1-5)"
        required: true
        default: "2"
        type: choice
        options: ["1", "2", "3", "4", "5"]

permissions:
  contents: read

concurrency:
  group: generate-drafts
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Type-check
        run: npm run typecheck
      - name: Run tests
        run: npm test
      - name: Check configured schedule
        id: schedule
        run: npm run scheduler-check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          DRAFT_LIMIT: ${{ inputs.draft_limit || '2' }}
      - name: Report skipped schedule
        if: steps.schedule.outputs.should_run != 'true'
        run: echo "No draft run is due for the configured timezone/hour, or the scheduler is disabled."
      - name: Fetch latest research report
        if: steps.schedule.outputs.should_run == 'true'
        run: npm run research
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Generate and save drafts
        if: steps.schedule.outputs.should_run == 'true'
        run: npm run generate-drafts
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_FREE_MODEL: ${{ vars.OPENROUTER_FREE_MODEL || 'openrouter/free' }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          ALLOW_PAID_AI: "false"
          DRAFT_LIMIT: ${{ steps.schedule.outputs.draft_limit }}
      - name: Record completed scheduled run
        if: success() && steps.schedule.outputs.should_run == 'true' && github.event_name == 'schedule'
        run: npm run scheduler-mark-run
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Upload draft report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scoialpilot-drafts
          path: reports/drafts-latest.json
          if-no-files-found: ignore
          retention-days: 7
